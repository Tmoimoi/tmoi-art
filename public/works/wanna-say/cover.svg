    <g transform="translate(220 320)" fill="#f5f2ec" opacity="0.7">
      <ellipse cx="0" cy="-50" rx="22" ry="28"/>
      <path d="M -30 -20 Q -30 60 0 80 Q 30 60 30 -20 Z"/>
    </g>
    <!-- 右侧多边形 -->
