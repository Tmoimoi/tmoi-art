name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # 使用 npm install 而非 npm ci：本项目是一次性静态站点部署，无需严格 lockfile 同步；
        # 安装的是最少 devDep（next/react/typescript/vercel CLI 等），体积小、几分钟完成。
        run: npm install --no-audit --no-fund
      - name: Build (Next.js static export → out/)
        run: npm run build
      - name: Write CNAME for custom domain (www.tmoi.cn)
        run: echo "www.tmoi.cn" > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
